name: Philomena Build

on: [push, pull_request]

jobs:
  build:
    name: 'Build Elixir app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: philomena-ci
    steps:
      - uses: actions/checkout@v4

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: |
            _build
            .cargo
            deps
          key: ${{ runner.os }}-deps-4-${{ hashFiles('mix.lock', 'native/philomena/Cargo.lock', 'docker/app/Dockerfile') }}

      - name: Enable caching
        run: |
          # Make ourselves the owner
          echo "RUN addgroup -g $(id -g) -S appgroup && adduser -u $(id -u) -S appuser -G appgroup" >> docker/app/Dockerfile
          echo "USER appuser" >> docker/app/Dockerfile
          echo "RUN mix local.hex --force && mix local.rebar --force" >> docker/app/Dockerfile

      - run: docker compose pull postgres opensearch valkey files
      - run: docker compose build

      - name: Build and test
        run: docker compose run --rm app run-test

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Clean up test services
        if: always()
        run: docker compose down --volumes

  typos:
    name: 'Check for spelling errors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  cargo:
    name: Rust Linting and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy, rustfmt

      - name: cargo fmt
        run: (cd native/philomena && cargo fmt --check)

      - name: cargo clippy
        run: (cd native/philomena && cargo clippy --locked -- -D warnings)

      - name: cargo test
        run: (cd native/philomena && cargo test --locked)

  prettier:
    name: 'Prettier Formatting Check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx prettier --check .

  lint-and-test:
    name: 'JavaScript Linting and Unit Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --ignore-scripts
        working-directory: ./assets

      - run: npm run lint
        working-directory: ./assets

      - run: npm run test
        working-directory: ./assets

      - run: npm run build
        working-directory: ./assets

  repo-init-script:
    name: 'Repo Init Script'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4

      - run: ./scripts/init.sh
      - run: typos --version
      - run: npx prettier --version
